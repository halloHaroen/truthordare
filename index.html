<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth or Dare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Truth or Dare</h1>
        <div id="setup-form">
            <h2>Setup Game</h2>
            <div id="player-inputs">
              <label for="player1">Player 1:</label>
              <input type="text" id="player1" required>
              <label for="player2">Player 2:</label>
              <input type="text" id="player2" required>
              <div id="additional-player-inputs"></div>
              <button id="add-player-button">Add Player</button>
            </div>
            <label for="theme">Theme:</label>
            <select id="theme">
                <option value="general">General</option>
                <option value="outdoor">Outdoor</option>
            </select>
            <label for="questionsPerPlayer">Questions Per Player:</label>
            <select id="questionsPerPlayer">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="15">15</option>
                <option value="20">20</option>
            </select>
            <button id="start-game-button">Start Game</button>
        </div>
        <div id="game-area" style="display: none;">
            <h2 id="current-player"></h2>
             <p id="current-question"></p>
              <div id="buttons">
                  <button id="truth-button">Truth</button>
                  <button id="dare-button">Dare</button>
                  <div class="button-container">
                    <button id="pass-button" style="display: none;">Pass</button>
                  <button id="next-player-button" style="display: none;">Next Player</button>
                   </div>
              </div>

        </div>
         <p id="version" class="version">v1.1</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
